<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>회복 원정대</title>
<meta name="description" content="물리치료 전공 지식으로 증상 몬스터와 보스를 물리치는 액션 학습 게임 시리즈">
<meta name="theme-color" content="#0b1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1026;--panel:#161d40;--panel2:#20295a;--line:rgba(255,255,255,.14);--text:#f2f5ff;--muted:#aab4d8;--gold:#ffd166;--good:#58e6a0;--bad:#ff6b6b;--accent:#7c6cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;word-break:keep-all;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.page{position:fixed;inset:0;overflow:auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--accent) 34%,transparent),transparent),var(--bg)}
.wrap{width:min(100%,860px);margin:0 auto}
.bar{display:flex;align-items:center;gap:8px;min-height:44px}
.bar h2{font-size:19px;margin:0;flex:1;min-width:0}
.ico{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px;text-decoration:none;color:var(--text)}
.coin{flex:none;padding:7px 11px;border-radius:999px;background:var(--panel);border:1px solid rgba(255,209,102,.5);color:var(--gold);font-weight:800;font-size:14px}
.logo{margin:16px 0 4px;font-size:clamp(34px,9vw,54px);line-height:1.08;font-weight:900;letter-spacing:-.5px;background:linear-gradient(100deg,#fff,var(--gold) 55%,#ff8fb1);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:14px}
.qbtn{min-height:62px;padding:9px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left;font-weight:800;font-size:15px}
.qbtn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.qbtn.hot{background:linear-gradient(135deg,#ff7a59,#c8379b);border:0}.qbtn.hot small{color:#ffe7ef}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:11px}
.wcard{position:relative;display:block;width:100%;text-align:left;padding:14px;border-radius:17px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 36%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);transition:transform .12s}
.wcard:hover{transform:translateY(-2px)}
.wcard b{display:block;font-size:19px}.wcard i{font-style:normal;color:var(--muted);font-size:13px}
.wcard .em{position:absolute;right:12px;top:10px;font-size:30px}
.prog{height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:10px}.prog em{display:block;height:100%;background:var(--c)}
.wcard small{display:block;margin-top:5px;color:var(--muted);font-size:12.5px}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.node{min-height:104px;padding:10px;border-radius:14px;text-align:left;background:var(--panel);border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);display:flex;flex-direction:column}
.node span{color:var(--c);font-weight:900;font-size:13px}.node b{font-size:14.5px;line-height:1.3;flex:1;margin:2px 0}
.node em{font-style:normal;color:var(--gold);letter-spacing:2px}.node.lock{opacity:.42;cursor:not-allowed;border-color:var(--line)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.sitem{padding:12px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.sitem.on{border-color:var(--gold)}
.sitem b{font-size:16px}.sitem p{margin:3px 0 9px;color:var(--muted);font-size:13.5px;line-height:1.4}
.buy{width:100%;min-height:42px;border-radius:10px;background:var(--panel2);font-weight:800}.buy.can{background:linear-gradient(135deg,#ffe08a,#f2b632);color:#2b2000}
.sec{font-size:16px;margin:18px 0 8px}
#play{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 10px 0;pointer-events:none}
.hrow{display:flex;align-items:center;gap:7px}
.hbar{position:relative;flex:1;height:17px;border-radius:9px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);overflow:hidden}
.hbar em{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff5f6d,#ffc371)}
.hbar span{position:absolute;inset:0;text-align:center;font-size:11.5px;line-height:15px;font-weight:800;text-shadow:0 1px 2px #000}
.xp{height:7px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;margin-top:4px}.xp em{display:block;height:100%;background:linear-gradient(90deg,#55e7ff,#7c6cff)}
.chip{flex:none;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.6);font-size:13px;font-weight:800}
.hbtn{pointer-events:auto;flex:none;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3)}
#bossBar{margin-top:5px}#bossBar .hbar{height:15px;border-color:#ffb3c1}#bossBar .hbar em{background:linear-gradient(90deg,#c9184a,#ff4d6d)}
#combo{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 88px);right:12px;text-align:right;font-weight:900;color:var(--gold);font-size:25px;text-shadow:0 2px 6px #000;pointer-events:none}
#combo small{display:block;font-size:12px;color:#fff}
#banner{position:absolute;left:0;right:0;top:27%;padding:0 18px;line-height:1.22;overflow-wrap:anywhere;text-align:center;font-size:clamp(23px,6.6vw,40px);font-weight:900;color:#fff;text-shadow:0 3px 14px #000,0 0 22px var(--accent);pointer-events:none;animation:ban 1.7s forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}14%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.act{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:11px;align-items:flex-end}
.abtn{position:relative;width:84px;height:84px;border-radius:50%;background:rgba(20,26,60,.82);border:2px solid rgba(255,255,255,.45);font-size:13px;font-weight:900;overflow:hidden}
.abtn i{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.2)}.abtn span{position:relative}
#ultB.ready{border-color:var(--gold);box-shadow:0 0 18px var(--gold);animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.ov{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));background:rgba(6,8,24,.8);backdrop-filter:blur(3px);overflow:auto;touch-action:pan-y}
.box{width:min(100%,560px);margin:auto;padding:15px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 48px rgba(0,0,0,.6)}
.qtag{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;color:var(--gold)}
.tbar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin:8px 0 10px}.tbar em{display:block;height:100%;background:var(--good)}
.qtext{font-size:17.5px;line-height:1.45;font-weight:800;margin:0 0 11px}
.opts{display:grid;gap:7px}
.opt{min-height:47px;padding:8px 12px;border-radius:11px;background:var(--panel2);border:1.5px solid var(--line);text-align:left;font-size:15px;line-height:1.35;display:flex;gap:9px;align-items:center}
.opt u{flex:none;width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.12);text-decoration:none;font-size:12.5px;font-weight:800}
.opt.ok{background:rgba(88,230,160,.22);border-color:var(--good)}.opt.no{background:rgba(255,107,107,.2);border-color:var(--bad)}.opt:disabled{cursor:default}
.exp{margin:10px 0 0;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.07);font-size:14.5px;line-height:1.5}
.go{display:block;width:100%;min-height:48px;margin-top:10px;border-radius:12px;background:linear-gradient(135deg,#ffe08a,#f2b632);color:#2b2000;font-weight:900;font-size:16px;text-align:center;text-decoration:none;line-height:48px}
.go.alt{background:var(--panel2);color:var(--text)}
.cards{display:grid;gap:8px;margin-top:9px}
.ucard{display:flex;gap:11px;align-items:center;padding:11px;border-radius:13px;background:var(--panel2);border:1.5px solid var(--line);text-align:left}
.ucard .e{flex:none;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:24px}
.ucard b{display:block;font-size:15.5px}.ucard small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.ucard.evo{border-color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.4)}
.stars{font-size:38px;letter-spacing:5px;color:var(--gold);text-align:center;line-height:1.1}.stars span{opacity:.2}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}
.grid3 div{padding:7px 3px;border-radius:10px;background:var(--panel2);text-align:center;font-size:12px;color:var(--muted)}.grid3 b{display:block;font-size:17px;color:var(--text)}
.rev{margin-top:7px;padding:8px 10px;border-left:3px solid var(--bad);background:rgba(255,255,255,.05);border-radius:0 9px 9px 0;font-size:13.5px;line-height:1.45}.rev b{display:block}
.ab{display:block;font-size:13px;line-height:1.15}.ab b{display:block;font-size:25px;line-height:1.1}
#goalT{display:inline-block;margin-top:5px;padding:3px 9px;border-radius:8px;background:rgba(0,0,0,.62);font-size:13px;font-weight:800;color:#ffe9a8}
#combo{top:calc(max(8px,env(safe-area-inset-top)) + 112px)}
.coach{position:absolute;z-index:3;bottom:calc(120px + env(safe-area-inset-bottom));padding:8px 11px;border-radius:11px;background:#fff;color:#17172b;font-size:14px;font-weight:900;pointer-events:none;box-shadow:0 5px 18px rgba(0,0,0,.5);animation:bob .7s infinite alternate}
.coach.left{left:14px;bottom:calc(150px + env(safe-area-inset-bottom))}.coach.right{right:14px}
@keyframes bob{to{transform:translateY(-6px)}}
#guide{position:fixed;z-index:30}
.grow{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.grow:last-of-type{border-bottom:0}
.grow .e{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:23px}
.grow b{display:block;font-size:15.5px}.grow small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.stg{color:var(--gold);font-weight:900;font-size:13px}.rule{margin:7px 0;padding:10px 11px;border-radius:11px;background:var(--panel2);font-size:14.5px;line-height:1.5}
.pl{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0 2px}.pl span{padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12.5px;font-weight:700}
.wtag{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:7px;background:rgba(0,0,0,.28);font-size:12px;font-weight:700}
.cont{display:block;width:100%;min-height:74px;margin-bottom:9px;padding:11px 14px;border-radius:15px;background:linear-gradient(135deg,#ffe08a,#f2a932);color:#2b2000;text-align:left;font-weight:900;font-size:18px}.cont small{display:block;font-size:13px;font-weight:700;margin-top:2px}

/* ---------- 게임 디자인 ---------- */
:root{--sab:env(safe-area-inset-bottom,0px);--bg:#120c2e;--panel:#241a52;--panel2:#33266e;--line:rgba(255,255,255,.18);--ink:#120d24;--disp:"Jua","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.page{background:radial-gradient(620px 340px at 50% 0,color-mix(in srgb,var(--accent) 42%,transparent),transparent),linear-gradient(180deg,#1a1142,#0e0a26)}
.bar h2,.logo,.wcard b,.qbtn,.cont,.go,.node b,.node span,.sitem b,.sec,.stg,.box h2,.qtag,.ucard b,.chip,.coin,.ab,#combo,#banner,#goalT,.coach,.buy{font-family:var(--disp);font-weight:400}
.ico,.coin{background:#2c2062;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.heroB{position:relative;margin:8px 0 10px;border-radius:20px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);aspect-ratio:16/8.6;background:#2b1b6e}
.heroB canvas{display:block;width:100%;height:100%}
.logo{position:absolute;left:0;right:0;top:8px;margin:0;text-align:center;font-size:clamp(38px,12vw,64px);line-height:1.05;letter-spacing:1px;color:#ffe27a;background:none;-webkit-text-fill-color:#ffe27a;-webkit-text-stroke:7px #2a1458;paint-order:stroke fill;text-shadow:0 5px 0 #2a1458}
.sub{font-size:14.5px}
.cont,.go,.qbtn,.buy{position:relative;border:3px solid var(--ink)!important;box-shadow:0 5px 0 var(--ink);transition:transform .07s,box-shadow .07s}
.cont:active,.go:active,.qbtn:active,.buy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.cont{background:linear-gradient(180deg,#ffe98f,#ffb52e);font-size:21px;margin-bottom:14px}.cont small{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
.qbtn{background:linear-gradient(180deg,#3b2c80,#2a1f61);font-size:17px}.qbtn small{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}.qbtn.hot{background:linear-gradient(180deg,#ff8a5c,#d93a8c)}
.quick{gap:11px;margin-bottom:16px}
.worlds{gap:13px}
.wcard{display:grid;grid-template-columns:82px minmax(0,1fr);column-gap:12px;align-items:center;padding:9px;border-radius:17px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 42%,#241a52),#221950);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.wcard:hover{transform:none}.wcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.wthumb{grid-row:1 / 6;width:82px;height:82px;border-radius:13px;border:2px solid var(--ink);display:block}
.wcard b{font-size:21px;line-height:1.1;grid-column:2}.wcard i{grid-column:2;color:#e5e0ff}.wcard br{display:none}.wtag{grid-column:2;justify-self:start;background:rgba(0,0,0,.34);margin-top:3px}.wcard .prog{grid-column:2;margin-top:5px;height:8px;border:1px solid rgba(0,0,0,.5)}.wcard small{grid-column:2;margin-top:3px;color:#e2dcff}
.nodes{position:relative;display:flex;flex-direction:column;gap:13px;margin-top:14px;padding:4px 0 10px}
.nodes::before{content:"";position:absolute;left:50%;top:18px;bottom:18px;border-left:7px dotted color-mix(in srgb,var(--c) 62%,transparent);transform:translateX(-50%)}
.node{position:relative;width:76%;min-height:74px;padding:9px 12px 9px 66px;border-radius:17px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 34%,#2a1f61),#241a52);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);justify-content:center}
.node:nth-child(even){align-self:flex-end}
.node span{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--ink);border:3px solid var(--ink);font-size:16px}
.node b{font-size:16px;flex:none}.node em{font-size:14px}
.node.lock{opacity:.62;filter:saturate(.25);border-color:var(--ink)}.node.lock span{background:#6c6888}
.node.cur{box-shadow:0 4px 0 var(--ink),0 0 0 3px #ffe27a,0 0 22px color-mix(in srgb,var(--c) 75%,transparent)}.node.cur span{animation:nodep .85s infinite alternate}
@keyframes nodep{to{transform:translateY(-50%) scale(1.12)}}
.sitem{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:10px;align-items:center}.sitem.on{outline:3px solid #ffe27a}
.sitem canvas{grid-row:1 / 3;width:64px;height:64px;border-radius:12px;background:rgba(255,255,255,.08)}.sitem .buy{grid-column:1 / -1;margin-top:5px}.sitem b{font-size:18px}.sitem p{margin:0}
.ov{background:rgba(10,6,32,.76)}
.box{border:3px solid var(--ink);border-radius:20px;background:linear-gradient(180deg,#32256e,#231950);box-shadow:0 0 0 2px rgba(255,226,122,.65),0 7px 0 var(--ink),0 22px 46px rgba(0,0,0,.6);animation:popin .2s cubic-bezier(.2,1.5,.5,1)}
@keyframes popin{from{transform:scale(.86);opacity:.2}}
.box h2{font-size:25px;color:#ffe27a;margin:2px 0 6px}
.qtag{font-size:15px;color:#ffe27a}.tbar{height:9px;border:2px solid var(--ink);border-radius:6px}
.qtext{font-size:18px}
.opt{min-height:52px;border:3px solid var(--ink);border-radius:13px;background:linear-gradient(180deg,#46378f,#352873);box-shadow:0 4px 0 var(--ink);font-weight:700;transition:transform .07s,box-shadow .07s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt u{width:29px;height:29px;border-radius:50%;background:#ffe27a;color:var(--ink);font-family:var(--disp);font-size:15px}
.opt.ok{background:linear-gradient(180deg,#39c98a,#21965f);border-color:var(--ink)}.opt.no{background:linear-gradient(180deg,#f06470,#c23a4d);border-color:var(--ink)}
.exp{background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.14)}
.go{background:linear-gradient(180deg,#ffe98f,#ffb52e);font-size:19px;line-height:45px}.go.alt{background:linear-gradient(180deg,#54438f,#3a2c74)}
.ucard{border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:linear-gradient(135deg,#46378f,#33266e)}.ucard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ucard .e{background:radial-gradient(circle at 35% 30%,#7d6bd6,#2d2163);border:2px solid var(--ink)}
.ucard.evo{background:linear-gradient(135deg,#a8641a,#6b3a94);box-shadow:0 4px 0 var(--ink),0 0 18px #ffd34d;border-color:var(--ink)}
.stars{font-size:48px;text-shadow:0 4px 0 #6b4200;animation:starp .45s cubic-bezier(.2,1.7,.5,1)}
@keyframes starp{from{transform:scale(.3) rotate(-10deg);opacity:0}}
.grid3 div{border:2px solid var(--ink);background:#2a1f61}.grow .e{border:2px solid var(--ink)}
.hud{padding-left:8px;padding-right:8px}
.hbtn{background:#2c2062;border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);color:#fff}
.hbar{height:21px;border:2px solid var(--ink);border-radius:11px;background:#2a1a2e;box-shadow:0 2px 0 rgba(0,0,0,.5)}
.hbar em{background:linear-gradient(180deg,#ff8f9b,#ff3f5f 55%,#d21f4a)}.hbar span{line-height:17px;font-size:12px}
.hbar::before{content:"❤";position:absolute;z-index:1;left:5px;top:-1px;font-size:13px;color:#fff;text-shadow:0 1px 1px #000}
#bossBar .hbar{height:19px}#bossBar .hbar::before{content:"👑"}
.xp{height:9px;border:2px solid var(--ink);border-radius:6px;background:#1a1533}.xp em{background:linear-gradient(180deg,#8ff3ff,#31b6ff)}
.chip{background:#2c2062;border:2px solid var(--ink);border-radius:9px;font-size:14px}
#goalT{border:2px solid var(--ink);background:#2c2062;font-size:14px}
#combo{font-size:32px;color:#ffe27a;-webkit-text-stroke:4px #2a1458;paint-order:stroke fill;text-shadow:0 3px 0 #2a1458}#combo small{-webkit-text-stroke:3px #2a1458;font-size:13px}
#banner{color:#fff;-webkit-text-stroke:6px #2a1458;paint-order:stroke fill;text-shadow:0 4px 0 #2a1458,0 0 26px var(--accent)}
.act{right:calc(10px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));flex-direction:column;align-items:center;gap:9px;z-index:2}

@keyframes upIn{0%{opacity:0;transform:scale(2.4) rotate(-5deg)}16%{opacity:1;transform:scale(.94)}26%{transform:scale(1.05)}34%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1.04)}}

<script>
(function(){
'use strict';
var ART=window.ARCADE_ART,WORLDS=window.ARCADE_WORLDS, KEY='aupt_arcade_v1', ARENA=1700, BOSS_AT=35, MAXLV=5, C=850, ULT_CD=2.5;
var $=function(id){return document.getElementById(id);};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
var reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- 저장 ---------- */
var SV={gold:0,hero:'rookie',owned:['rookie'],meta:{atk:0,hp:0,mag:0,luck:0},stars:{},wrong:{},best:0,daily:'',sound:true,kills:0,srs:{},plays:{},last:'',guided:false,ultUsed:0,build:{}};
try{var raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw){Object.keys(raw).forEach(function(k){SV[k]=raw[k];});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SV));}catch(e){}}
var HEROES=[
 {id:'rookie',n:'신입 치료사',d:'균형 잡힌 능력',c:'#58c7ff',hair:'#2b2320',price:0,hp:0,dmg:1,spd:1,start:'wave'},
 {id:'manual',n:'도수 달인',d:'공격력 +25%, 체력 −15, 보호 손길로 시작',c:'#ff8a5c',hair:'#4a2c1a',price:400,hp:-15,dmg:1.25,spd:1,start:'orbit'},
 {id:'coach',n:'재활 코치',d:'체력 +35, 초당 1 회복, 냉각 구역으로 시작',c:'#58e6a0',hair:'#c9c9c9',price:700,hp:35,dmg:1,spd:.96,regen:1,start:'frost'},
 {id:'sprinter',n:'보행 전문가',d:'이동 +20%, 회피 재사용 40% 단축, 전기 자극으로 시작',c:'#ffd166',hair:'#222',price:1000,hp:-5,dmg:1,spd:1.2,dash:.6,start:'bolt'}];
var META=[
 {k:'atk',n:'근력 강화',d:'공격력 +6%',e:'💪'},{k:'hp',n:'심폐 지구력',d:'최대 체력 +10',e:'❤️'},
 {k:'mag',n:'집중력',d:'지식 구슬 흡수 범위 +12%',e:'🧲'},{k:'luck',n:'임상 경험',d:'획득 코인 +8%',e:'🍀'}];
function metaCost(k){return 60+SV.meta[k]*70;}
function hero(){return HEROES.filter(function(h){return h.id===SV.hero;})[0]||HEROES[0];}

/* ---------- 효과음 ---------- */
var AC=null,lastS={};
function snd(type){
  if(!SV.sound) return;
  var now=performance.now(); if(lastS[type]&&now-lastS[type]<55) return; lastS[type]=now;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
    var T={shot:[520,300,.05,.018,'triangle'],hit:[180,90,.06,.03,'square'],kill:[420,120,.09,.04,'sawtooth'],xp:[880,1320,.06,.025,'sine'],level:[520,1240,.28,.08,'triangle'],ok:[660,1320,.22,.09,'sine'],up:[330,1560,.4,.13,'square'],evo:[70,2200,.9,.18,'sawtooth'],no:[220,90,.3,.09,'sawtooth'],hurt:[140,60,.16,.08,'square'],ult:[90,900,.5,.13,'sawtooth'],boss:[70,160,.7,.14,'sawtooth'],win:[440,1760,.6,.11,'triangle']}[type];
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=T[4];o.frequency.setValueAtTime(T[0],t);o.frequency.exponentialRampToValueAtTime(T[1],t+T[2]);
    g.gain.setValueAtTime(T[3],t);g.gain.exponentialRampToValueAtTime(.0001,t+T[2]);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+T[2]+.01);
  }catch(e){}
}

/* ---------- 메뉴 화면 ---------- */
function show(id){['home','map','store','play'].forEach(function(x){$(x).hidden=x!==id;});}
function worldStars(w){var s=SV.stars[w.id]||{},n=0;Object.keys(s).forEach(function(k){n+=s[k];});return n;}
function bar(title,back){
  var b=el('div','bar');
  if(back){var x=el('button','ico','←');x.type='button';x.setAttribute('aria-label','뒤로');x.onclick=back;b.appendChild(x);}
  else{var a=el('a','ico','←');a.href=campusHref();a.setAttribute('aria-label','캠퍼스로 돌아가기');b.appendChild(a);}
  b.appendChild(el('h2','',title));
  var s=el('button','ico',SV.sound?'🔊':'🔇');s.type='button';s.setAttribute('aria-label','소리 켜기·끄기');s.onclick=function(){SV.sound=!SV.sound;save();s.textContent=SV.sound?'🔊':'🔇';};b.appendChild(s);
  b.appendChild(el('span','coin','🪙 '+SV.gold));
  return b;
}
var LAB={neuroanat:'장',neuro:'장',cardio:'장',anatomy:'강',funcanat:'강',exercise:'강',msk:'강',modality:'강',clindx:'강'};
function worldTitle(w){return w.name+' ('+w.subj+')';}
function nextIdx(w){var S=SV.stars[w.id]||{};for(var i=0;i<w.stages.length;i++)if(!S[w.stages[i].n])return i;return -1;}
function continueTarget(){var w=WORLDS.filter(function(x){return x.id===SV.last;})[0]||WORLDS[0];return {w:w,i:nextIdx(w)};}
function launch(w,i){if(i>=0)startStage(w,i,'stage');else startStage(w,-1,'final');}
function renderGuide(cb){
  var b=$('guideBox');b.innerHTML='';b.appendChild(el('h2','','조작 방법'));
  [['🕹️','조이스틱','왼쪽 아래 조이스틱을 밀어 이동 · 화면 왼쪽 어디서든 시작 가능'],['🌊','공격','가까운 적에게 자동 발사'],['💨','회피 버튼','오른쪽 맨 아래 · 짧게 돌진, 그동안 무적'],['💥','필살기 버튼','회피 버튼 위 · 횟수 제한 없음(2.5초마다) · 주변 적 큰 피해 · 체력 30% 미만이면 자동 발동'],['📘','문제','레벨업·보스·미사일 피격 때 출제 · 피격 문제를 맞히면 피해 없음 · 장마다 문제를 모두 풀어야 클리어'],['🚑','쓰러졌을 때','응급 처치 문제로 최대 2번 부활']].forEach(function(r){
    var x=el('div','grow');x.appendChild(el('span','e',r[0]));var t=el('span');t.appendChild(el('b','',r[1]));t.appendChild(el('small','',r[2]));x.appendChild(t);b.appendChild(x);});
  var g=el('button','go',cb?'확인했어요':'닫기');g.type='button';g.id='guideGo';g.onclick=function(){SV.guided=true;save();$('guide').hidden=true;if(cb)cb();};b.appendChild(g);
  $('guide').hidden=false;$('guide').scrollTop=0;
}
function campusHref(){var v='';try{v=sessionStorage.getItem('aupt_from_campus')||'';}catch(e){}return v?'./?from=arcade'+(v!=='1'?'&'+v:''):'./';}
function renderHome(){
  var h=$('home');h.innerHTML='';h.style.setProperty('--accent','#7c6cff');var w=el('div','wrap');h.appendChild(w);
  w.appendChild(bar(''));
  var hb=el('div','heroB'),bw=Math.min(860,(h.clientWidth||360)-32);hb.appendChild(ART.banner(bw,Math.round(bw*(bw>=728?.34:.54))));hb.appendChild(el('div','logo','회복 원정대'));w.appendChild(hb);
  w.appendChild(el('p','sub','1장부터 차례로 깨면 지난 내용이 자동으로 다시 나옵니다'));
  var ct=continueTarget(),c0=el('button','cont');c0.type='button';c0.id='contB';
  c0.appendChild(document.createTextNode('▶ '+(SV.last?'이어하기':'1장부터 시작')));
  c0.appendChild(el('small','',worldTitle(ct.w)+' · '+(ct.i>=0?ct.w.stages[ct.i].n+LAB[ct.w.id]+' '+ct.w.stages[ct.i].t:'전 범위 총정리')));
  c0.onclick=function(){launch(ct.w,ct.i);};w.appendChild(c0);
  var q=el('div','quick'),dDone=SV.daily===today();
  var d=el('button','qbtn hot');d.type='button';d.appendChild(document.createTextNode('🔥 오늘의 도전'));d.appendChild(el('small','',dDone?'보상 수령 완료':'복습 우선 · 150코인'));d.onclick=function(){startStage(null,-1,'daily');};q.appendChild(d);
  var g2=el('button','qbtn');g2.type='button';g2.appendChild(document.createTextNode('❓ 조작 방법'));g2.appendChild(el('small','','이동·회피·필살기'));g2.onclick=function(){renderGuide();};q.appendChild(g2);
  var s=el('button','qbtn');s.type='button';s.style.gridColumn='1 / -1';s.appendChild(document.createTextNode('🛡️ 캐릭터·강화'));s.appendChild(el('small','','사용 캐릭터: '+hero().n));s.onclick=renderStore;q.appendChild(s);
  w.appendChild(q);
  var g=el('div','worlds');
  WORLDS.forEach(function(wd){
    var c=el('button','wcard');c.type='button';c.style.setProperty('--c',wd.color);
    var th=ART.thumb(wd.id,82);th.className='wthumb';th.setAttribute('aria-hidden','true');c.appendChild(th);c.appendChild(el('b','',wd.name));c.appendChild(el('i','','('+wd.subj+')'));c.appendChild(document.createElement('br'));c.appendChild(el('span','wtag',STYLES[STYLE_OF[wd.id]].tag));
    var max=wd.stages.length*3,got=worldStars(wd),p=el('div','prog'),e=el('em');e.style.width=(got/max*100)+'%';p.appendChild(e);c.appendChild(p);
    var due=dueList(wd).length;c.appendChild(el('small','','★ '+got+' / '+max+' · '+wd.stages.length+LAB[wd.id]+(due?' · 복습 '+due:'')));
    c.onclick=function(){renderMap(wd);};g.appendChild(c);
  });
  w.appendChild(g);show('home');$('home').scrollTop=0;
}
function renderMap(wd){
  var m=$('map');m.innerHTML='';m.style.setProperty('--accent',wd.color);m.style.setProperty('--c',wd.color);var w=el('div','wrap');m.appendChild(w);
  w.appendChild(bar(wd.icon+' '+worldTitle(wd),renderHome));
  w.appendChild(el('p','sub',STYLES[STYLE_OF[wd.id]].tag+' · 별 '+worldStars(wd)+' / '+wd.stages.length*3));
  var ni=nextIdx(wd),c0=el('button','cont');c0.type='button';c0.appendChild(document.createTextNode('▶ '+(ni>=0?wd.stages[ni].n+LAB[wd.id]+' 시작':'전 범위 총정리')));c0.appendChild(el('small','',ni>=0?wd.stages[ni].t:'1'+LAB[wd.id]+'부터 끝까지 약한 문항 순회'));c0.onclick=function(){launch(wd,ni);};w.appendChild(c0);
  var due=dueList(wd).length;
  if(due){var t=el('button','qbtn hot');t.type='button';t.style.width='100%';t.appendChild(document.createTextNode('🔁 자동 복습 ('+due+'문항)'));t.appendChild(el('small','','지금 다시 볼 때가 된 문항을 앞 장부터'));t.onclick=function(){startStage(wd,-1,'wrong');};w.appendChild(t);}
  var ns=el('div','nodes'),S=SV.stars[wd.id]||{};
  wd.stages.forEach(function(st,i){
    var open=i===0||S[wd.stages[i-1].n]>0, n=el('button','node'+(open?'':' lock')+(i===ni?' cur':''));n.type='button';n.style.setProperty('--c',wd.color);
    n.appendChild(el('span','',st.n+LAB[wd.id]));n.appendChild(el('b','',st.t));var v=S[st.n]||0;n.appendChild(el('em','',open?'★'.repeat(v)+'☆'.repeat(3-v):'🔒'));
    if(open) n.onclick=function(){startStage(wd,i,'stage');}; else n.disabled=true;
    ns.appendChild(n);
  });
  w.appendChild(ns);show('map');m.scrollTop=0;
}
function renderStore(){
  var p=$('store');p.innerHTML='';var w=el('div','wrap');p.appendChild(w);
  w.appendChild(bar('캐릭터·강화',renderHome));
  w.appendChild(el('h3','sec','캐릭터'));
  var a=el('div','shop');
  HEROES.forEach(function(h){
    var has=SV.owned.indexOf(h.id)>=0,on=SV.hero===h.id,c=el('div','sitem'+(on?' on':''));
    c.appendChild(ART.heroThumb(h.id,64));c.appendChild(el('b','',h.n));c.appendChild(el('p','',h.d));
    var b=el('button','buy'+(!on&&(has||SV.gold>=h.price)?' can':''),on?'사용 중':has?'선택':'🪙 '+h.price+' 영입');b.type='button';
    b.onclick=function(){if(on)return;if(!has){if(SV.gold<h.price)return;SV.gold-=h.price;SV.owned.push(h.id);}SV.hero=h.id;save();renderStore();};
    c.appendChild(b);a.appendChild(c);
  });
  w.appendChild(a);w.appendChild(el('h3','sec','영구 강화'));
  var m=el('div','shop');
  META.forEach(function(x){
    var lv=SV.meta[x.k],max=lv>=10,cost=metaCost(x.k),c=el('div','sitem');
    var mi=el('span','',x.e);mi.style.cssText='grid-row:1 / 3;font-size:34px;text-align:center';c.appendChild(mi);c.appendChild(el('b','',x.n+' Lv.'+lv));c.appendChild(el('p','',x.d));
    var b=el('button','buy'+(!max&&SV.gold>=cost?' can':''),max?'최대':'🪙 '+cost);b.type='button';
    b.onclick=function(){if(max||SV.gold<cost)return;SV.gold-=cost;SV.meta[x.k]++;save();renderStore();};
    c.appendChild(b);m.appendChild(c);
  });
  w.appendChild(m);show('store');p.scrollTop=0;
}

function joyHome(){if(joy.on)return;var r=jz.getBoundingClientRect(),safe=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab'))||0;joyPos(Math.max(82,18+JR),r.height-JR-24-safe);jk.style.transform='translate(0,0)';}
function joyLocal(e){var r=jz.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function joyMove(p){
  var dx=p.x-joy.x0,dy=p.y-joy.y0,d=Math.hypot(dx,dy);
  if(d>JR*1.25){var over=d-JR*1.25;joyPos(joy.x0+dx/d*over,joy.y0+dy/d*over);dx=p.x-joy.x0;dy=p.y-joy.y0;d=Math.hypot(dx,dy);}
  var m=d<7?0:clamp((d-7)/(JR*.5),.35,1),ux=d?dx/d:0,uy=d?dy/d:0,show=Math.min(d,JR*.72);
  input.x=ux*m;input.y=uy*m;jk.style.transform='translate('+(ux*show)+'px,'+(uy*show)+'px)';
}
jz.addEventListener('pointerdown',function(e){if(joy.on)return;e.preventDefault();joy.on=true;joy.id=e.pointerId;var p=joyLocal(e);if(Math.hypot(p.x-joy.x0,p.y-joy.y0)>JR)joyPos(clamp(p.x,JR+6,jz.clientWidth),clamp(p.y,JR+6,jz.clientHeight-JR-6));jb.classList.add('on');try{jz.setPointerCapture(e.pointerId);}catch(x){}joyMove(p);});
jz.addEventListener('pointermove',function(e){if(!joy.on||e.pointerId!==joy.id)return;e.preventDefault();joyMove(joyLocal(e));});
function joyEnd(e){if(!joy.on||e.pointerId!==joy.id)return;joy.on=false;joy.id=null;input.x=0;input.y=0;jb.classList.remove('on');joyHome();keyAxis();}
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);jz.addEventListener('lostpointercapture',joyEnd);
function actBtn(btn,fn){
  function nope(){btn.classList.remove('nope');void btn.offsetWidth;btn.classList.add('nope');}
  btn.addEventListener('pointerdown',function(e){e.preventDefault();btn.classList.add('hitp');if(!G||G.paused||G.ended)return;if(!fn())nope();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){btn.addEventListener(t,function(){btn.classList.remove('hitp');});});
  btn.addEventListener('contextmenu',function(e){e.preventDefault();});
}
actBtn($('ultB'),useUlt);actBtn($('dashB'),useDash);$('pauseB').onclick=pauseMenu;
document.addEventListener('visibilitychange',function(){if(document.hidden&&G&&!G.paused&&!G.ended)pauseMenu();});

/* ---------- 루프 ---------- */
var last=0,slow=0;
function loop(now){
  requestAnimationFrame(loop);
  var raw=(now-last)/1000||0,dt=Math.min(.04,raw);last=now;
  if(!G||$('play').hidden)return;
  if(raw<.5){slow=raw>.03?Math.min(60,slow+1):Math.max(0,slow-1);if(slow>40&&!lowFx){lowFx=true;resize();if(G)G.pat=null;}}
  if(G.q&&!G.q.done){G.q.t+=dt;var left=1-G.q.t/G.q.limit,b=$('qTime');if(b){b.style.width=left*100+'%';b.style.background=left<.3?'var(--bad)':left<.6?'#ffd166':'var(--good)';}if(left<=0)answer(-1);}
  if(!G)return;
  if(G.slowT>0&&!G.paused)G.slowT-=dt;
  if(!G.paused)update(dt*(G.slowT>0?.2:1));
  if(!G)return;
  updateFx(dt);draw();hud();
}
requestAnimationFrame(loop);

window.__arc={get G(){return G;},get ARENA(){return ARENA;},SV:SV,WORLDS:WORLDS,startStage:startStage,update:update,updateFx:updateFx,draw:draw,answer:answer,dueList:dueList,STYLES:STYLES,goalPoint:function(){return G&&G.style.point&&G.style.point();},useUlt:useUlt,useDash:useDash,renderHome:renderHome,renderMap:renderMap,renderStore:renderStore,input:input,finish:finish,cardOptions:cardOptions,loop:loop};
renderHome();
(function(){var q=new URLSearchParams(location.search),id=q.get('w'),w=WORLDS.filter(function(x){return x.id===id;})[0];
  if(!w)return;if(q.get('play')==='1')launch(w,nextIdx(w));else renderMap(w);
  try{history.replaceState(null,'',location.pathname);}catch(e){}})();
})();
